<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS-BIM Seamless Evacuation Showcase</title>
    
    <!-- Cesium CDN -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #000; overflow: hidden; }
        #cesiumContainer { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        .glass-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            color: white;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        h1 { margin: 0 0 8px 0; font-size: 20px; color: #facc15; letter-spacing: -0.5px; }
        p.subtitle { margin: 0 0 24px 0; font-size: 13px; color: #94a3b8; line-height: 1.5; }
        
        .status-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            border-left: 3px solid #3b82f6;
        }
        .status-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .status-text { font-size: 16px; font-weight: 600; color: #f8fafc; }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn:hover { background: #1d4ed8; }
        .btn.danger { background: #ef4444; }
        .btn.danger:hover { background: #dc2626; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        
        .legend { margin-top: 16px; font-size: 12px; color: #cbd5e1; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; }
        .color-box { width: 14px; height: 14px; border-radius: 4px; margin-right: 8px; }
    </style>
</head>
<body>
<a href="index.html" style="position: fixed; top: 20px; right: 20px; z-index: 9999; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px 20px; border-radius: 8px; color: #f8fafc; font-weight: 600; text-decoration: none; font-size: 14px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); transition: all 0.2s;">⬅️ Back to Main Dashboard</a>

<div id="cesiumContainer"></div>

<div class="glass-panel">
    <h1>GIS-BIM Integration</h1>
    <p class="subtitle">실외 도로망에서 건축물 실내 계단까지 이어지는 끊김 없는(Seamless) 대피 라우팅 시뮬레이션</p>
    
    <div class="status-box">
        <div class="status-label">Current Situation</div>
        <div class="status-text" id="status-display">평상시 (안전)</div>
    </div>
    
    <button id="btn-start" class="btn danger">🌊 폭풍 해일 및 대피 시작</button>
    <button id="btn-reset" class="btn" disabled>🔄 초기화</button>
    
    <div class="legend">
        <div class="legend-item"><div class="color-box" style="background: rgba(255,255,255,0.2); border: 1px solid white;"></div>가상 병원(대피소) 3D 구조</div>
        <div class="legend-item"><div class="color-box" style="background: rgba(59,130,246,0.6);"></div>해일 침수 (1층)</div>
        <div class="legend-item"><div class="color-box" style="background: #ef4444; border-radius: 50%;"></div>피난민 (대피 동선)</div>
    </div>
</div>

<script>
    // 0. Cesium Ion 토큰 세팅
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIzYTM3ODhlNC1jOWUxLTRhOTYtYTgwZC1iMDA3OGJiMTQwZDciLCJpZCI6MTI5NDU5LCJpYXQiOjE2ODIwNTc4NjN9.GC-W9QfAFa9rXMh2Ow2rSC5UvLcwtS_qjWJ1v454z1A";

    // 1. Cesium Viewer 초기화
    const viewer = new Cesium.Viewer('cesiumContainer', {
        terrainProvider: undefined, // 평탄한 지형 사용
        baseLayerPicker: false,
        animation: true,
        timeline: false,
        fullscreenButton: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        sceneModePicker: false,
        selectionIndicator: false,
        navigationHelpButton: false,
        shouldAnimate: true
    });

    // 라이팅 및 환경 세팅
    viewer.scene.globe.enableLighting = true;
    viewer.scene.highDynamicRange = true;

    // 바하마 낫소 시내 임의의 위치
    const originLon = -77.345;
    const originLat = 25.075;
    
    // 카메라 초기 위치 세팅
    viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(originLon, originLat - 0.003, 150),
        orientation: {
            heading: Cesium.Math.toRadians(0),
            pitch: Cesium.Math.toRadians(-45),
            roll: 0.0
        },
        duration: 0
    });

    // 2. 가상 건축물 (BIM 대용 3층 폴리곤) 렌더링
    // 가로 약 40m, 세로 약 30m 크기의 건물 베이스
    const bldLonMin = originLon - 0.0002;
    const bldLonMax = originLon + 0.0002;
    const bldLatMin = originLat - 0.00015;
    const bldLatMax = originLat + 0.00015;
    
    const buildingPositions = Cesium.Cartesian3.fromDegreesArray([
        bldLonMin, bldLatMin,
        bldLonMax, bldLatMin,
        bldLonMax, bldLatMax,
        bldLonMin, bldLatMax
    ]);

    // 1층 (0 ~ 4m)
    viewer.entities.add({
        id: 'floor1',
        polygon: {
            hierarchy: buildingPositions,
            height: 0,
            extrudedHeight: 4,
            material: Cesium.Color.WHITE.withAlpha(0.2),
            outline: true,
            outlineColor: Cesium.Color.WHITE.withAlpha(0.5)
        }
    });

    // 2층 (4 ~ 8m)
    viewer.entities.add({
        id: 'floor2',
        polygon: {
            hierarchy: buildingPositions,
            height: 4,
            extrudedHeight: 8,
            material: Cesium.Color.LIGHTGRAY.withAlpha(0.2),
            outline: true,
            outlineColor: Cesium.Color.WHITE.withAlpha(0.5)
        }
    });

    // 3층 (8 ~ 12m) 대피 구역
    viewer.entities.add({
        id: 'floor3',
        polygon: {
            hierarchy: buildingPositions,
            height: 8,
            extrudedHeight: 12,
            material: Cesium.Color.YELLOW.withAlpha(0.25),
            outline: true,
            outlineColor: Cesium.Color.YELLOW.withAlpha(0.8)
        }
    });

    // 3. 침수(Water) 폴리곤 (초기엔 안 보임)
    const waterEntity = viewer.entities.add({
        id: 'water',
        polygon: {
            hierarchy: buildingPositions,
            height: 0,
            extrudedHeight: 0.01,
            material: Cesium.Color.CORNFLOWERBLUE.withAlpha(0.6),
            outline: false
        }
    });

    // 4. 피난민 동적 파티클 생성 및 경로 설정
    const evacuee = viewer.entities.add({
        id: 'evacuee',
        position: Cesium.Cartesian3.fromDegrees(originLon - 0.001, originLat - 0.001, 0),
        point: {
            pixelSize: 15,
            color: Cesium.Color.RED,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2,
            disableDepthTestDistance: Number.POSITIVE_INFINITY // 건물 벽 투시해서 보이도록
        },
        path: {
            resolution: 1,
            material: new Cesium.PolylineDashMaterialProperty({
                color: Cesium.Color.RED,
                dashLength: 8.0
            }),
            width: 3,
            leadTime: 0,
            trailTime: 60 // 과거 궤적을 남김
        }
    });

    // 시뮬레이션 상태 변수
    let isSimulating = false;
    let waterLevel = 0.01;

    // 5. 시뮬레이션 시작 (애니메이션 구동 로직)
    function startSimulation() {
        isSimulating = true;
        waterLevel = 0.01;
        document.getElementById('status-display').innerText = "해일 경보! 1층 대피 중...";
        document.getElementById('status-display').style.color = "#facc15";

        // 시간 동기화 설정 (현재 시간부터 25초간의 애니메이션)
        const start = Cesium.JulianDate.fromDate(new Date());
        const stop = Cesium.JulianDate.addSeconds(start, 25, new Cesium.JulianDate());
        
        viewer.clock.startTime = start.clone();
        viewer.clock.stopTime = stop.clone();
        viewer.clock.currentTime = start.clone();
        viewer.clock.clockRange = Cesium.ClockRange.CLAMPED;
        viewer.clock.multiplier = 1; // 1배속 재생

        // SampledPositionProperty로 시간별 좌표 매핑
        const positionProperty = new Cesium.SampledPositionProperty();
        
        // T=0 (외부 도로 시작점)
        positionProperty.addSample(start, Cesium.Cartesian3.fromDegrees(originLon - 0.001, originLat - 0.001, 0));
        
        // T=5 (건물 1층 입구 도달)
        positionProperty.addSample(Cesium.JulianDate.addSeconds(start, 5, new Cesium.JulianDate()), 
            Cesium.Cartesian3.fromDegrees(bldLonMin, originLat, 0));
            
        // T=10 (1층 건물 내부 중심 도달)
        positionProperty.addSample(Cesium.JulianDate.addSeconds(start, 10, new Cesium.JulianDate()), 
            Cesium.Cartesian3.fromDegrees(originLon, originLat, 0));
            
        // T=15 (2층 계단 도착, 고도 4m 상승)
        positionProperty.addSample(Cesium.JulianDate.addSeconds(start, 15, new Cesium.JulianDate()), 
            Cesium.Cartesian3.fromDegrees(originLon + 0.0001, originLat + 0.0001, 4));
            
        // T=20 (3층 계단 도착, 고도 8m 상승)
        positionProperty.addSample(Cesium.JulianDate.addSeconds(start, 20, new Cesium.JulianDate()), 
            Cesium.Cartesian3.fromDegrees(originLon - 0.0001, originLat + 0.0001, 8));
            
        // T=25 (3층 안전 구역 안착, 고도 8m)
        positionProperty.addSample(Cesium.JulianDate.addSeconds(start, 25, new Cesium.JulianDate()), 
            Cesium.Cartesian3.fromDegrees(originLon, originLat - 0.0001, 8));

        // 생성한 애니메이션 경로를 Entity에 할당
        evacuee.position = positionProperty;

        // 카메라 추적 활성화
        viewer.trackedEntity = evacuee;
        
        // 카메라를 약간 뒤/위에서 비스듬히 따라가게 조정
        viewer.trackedEntity.viewFrom = new Cesium.Cartesian3(-150, -150, 100);

        // 물 차오르는 애니메이션 리스너 등록
        viewer.scene.preUpdate.addEventListener(updateWaterLevel);
    }

    // 매 프레임마다 물 수위를 올리고 텍스트 상태 변경
    function updateWaterLevel(scene, time) {
        if (!isSimulating) return;
        
        const secondsElapsed = Cesium.JulianDate.secondsDifference(viewer.clock.currentTime, viewer.clock.startTime);
        
        // 5초부터 물이 서서히 차오름 (최대 4m)
        if (secondsElapsed > 5 && waterLevel < 4.0) {
            waterLevel += 0.02; // 수위 상승
            waterEntity.polygon.extrudedHeight = waterLevel;
        }

        // 상태 메세지 갱신
        if (secondsElapsed > 20) {
            document.getElementById('status-display').innerText = "3층 대피 완료 (안전)";
            document.getElementById('status-display').style.color = "#10b981";
        } else if (secondsElapsed > 10) {
            document.getElementById('status-display').innerText = "계단 이용 2층 진입...";
            document.getElementById('status-display').style.color = "#3b82f6";
        } else if (secondsElapsed > 5) {
            document.getElementById('status-display').innerText = "1층 침수 발생! 대피 중...";
            document.getElementById('status-display').style.color = "#ef4444";
        }
        
        // 애니메이션이 끝나면 리스너 제거
        if (secondsElapsed >= 25) {
            isSimulating = false;
            viewer.scene.preUpdate.removeEventListener(updateWaterLevel);
            document.getElementById('btn-start').innerText = "시뮬레이션 완료";
            document.getElementById('btn-reset').disabled = false;
        }
    }

    // 버튼 이벤트 바인딩
    document.getElementById('btn-start').addEventListener('click', () => {
        if (isSimulating) return;
        document.getElementById('btn-start').disabled = true;
        startSimulation();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
        // 상태 리셋
        waterLevel = 0.01;
        waterEntity.polygon.extrudedHeight = waterLevel;
        evacuee.position = Cesium.Cartesian3.fromDegrees(originLon - 0.001, originLat - 0.001, 0);
        viewer.trackedEntity = undefined;
        
        // 카메라 원복
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(originLon, originLat - 0.003, 150),
            orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-45),
                roll: 0.0
            },
            duration: 1
        });

        document.getElementById('status-display').innerText = "평상시 (안전)";
        document.getElementById('status-display').style.color = "#f8fafc";
        
        document.getElementById('btn-start').disabled = false;
        document.getElementById('btn-start').innerText = "🌊 폭풍 해일 및 대피 시작";
        document.getElementById('btn-reset').disabled = true;
    });

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dMRV 3D Ecological Dashboard</title>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Turf.js -->
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #0B0F19; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* 다크 글래스 UI */
        .glass-panel {
            position: absolute;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        #ui-top-left {
            top: 20px;
            left: 20px;
            width: 340px;
            padding: 24px;
        }

        #ui-bottom-center {
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        h1 { margin: 0 0 4px 0; font-size: 22px; color: #10b981; letter-spacing: -0.5px; }
        p.subtitle { margin: 0 0 20px 0; font-size: 13px; color: #94a3b8; line-height: 1.5; }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .kpi-card {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
        }
        
        .kpi-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .kpi-value { font-size: 24px; font-weight: 700; color: #f8fafc; }
        .kpi-unit { font-size: 12px; color: #64748b; font-weight: 400; margin-left: 4px; }

        /* 슬라이더 영역 */
        .slider-container { flex: 1; }
        .slider-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; font-size: 14px;}
        .year-display { color: #10b981; font-size: 18px; }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #334155;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .btn-play {
            width: 48px;
            height: 48px;
            border-radius: 24px;
            background: #10b981;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-play:hover { background: #059669; transform: scale(1.05); }

        /* 범례 */
        .legend-box {
            margin-top: 16px;
        }
        .legend-title { font-size: 11px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase;}
        .legend-bar {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #b45309, #d97706, #10b981, #059669);
            margin-bottom: 4px;
        }
        .legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: #64748b; }
    </style>
</head>
<body>
<a href="index.html" style="position: fixed; top: 20px; right: 20px; z-index: 9999; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px 20px; border-radius: 8px; color: #f8fafc; font-weight: 600; text-decoration: none; font-size: 14px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); transition: all 0.2s;">⬅️ Back to Main Dashboard</a>

<div id="map"></div>

<!-- 좌측 상단 대시보드 -->
<div id="ui-top-left" class="glass-panel">
    <h1>dMRV Ecological Dashboard</h1>
    <p class="subtitle">드론 LiDAR 및 AI 융합 맹그로브 탄소 포집량 3D 모니터링 시스템 (안드로스 섬 연안)</p>
    
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-title">Total Blue Carbon</div>
            <div class="kpi-value" id="kpi-carbon">0<span class="kpi-unit">Tons</span></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-title">Avg. Health (NDVI)</div>
            <div class="kpi-value" id="kpi-ndvi">0.0<span class="kpi-unit">Idx</span></div>
        </div>
    </div>
    
    <div class="legend-box">
        <div class="legend-title">Carbon Density (Ton/ha)</div>
        <div class="legend-bar"></div>
        <div class="legend-labels">
            <span>Low (Degraded)</span>
            <span>High (Restored)</span>
        </div>
    </div>
</div>

<!-- 하단 타임라인 컨트롤러 -->
<div id="ui-bottom-center" class="glass-panel">
    <button class="btn-play" id="play-btn">▶</button>
    <div class="slider-container">
        <div class="slider-header">
            <span>Restoration Timeline</span>
            <span class="year-display" id="year-label">2024</span>
        </div>
        <input type="range" id="year-slider" min="2024" max="2030" step="0.01" value="2024">
    </div>
</div>

<script>
    // 1. 맵 초기화
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [-77.80, 24.75], // 안드로스 섬 (Andros Island) 동쪽 연안
        zoom: 12.5,
        pitch: 55,
        bearing: 25
    });

    // 2. 데이터 생성 (Turf.js 헥사곤 그리드)
    // 안드로스 섬 동쪽 해안선(Andros Town 주변) Bounding Box
    const bbox = [-77.95, 24.50, -77.65, 24.90];
    const cellSide = 0.6; // km
    let hexGrid = turf.hexGrid(bbox, cellSide, {units: 'kilometers'});
    
    // 해안선을 나타내는 대략적인 LineString (북에서 남으로)
    const coastline = turf.lineString([
        [-77.88, 24.85],
        [-77.80, 24.75],
        [-77.77, 24.65],
        [-77.74, 24.55]
    ]);
    
    // 해안선을 따라 일정 거리(약 3.5km) 이내의 헥사곤만 남김
    hexGrid.features = hexGrid.features.filter(f => {
        const center = turf.centerOfMass(f);
        const dist = turf.pointToLineDistance(center, coastline, {units: 'kilometers'});
        // 해안선 굴곡을 더 자연스럽게 하기 위해 약간의 랜덤 노이즈 추가
        const randomFactor = Math.random() * 0.8;
        return (dist + randomFactor) < 3.5; 
    });

    // 각 헥사곤에 초기 상태(2024) 및 성장 계수 부여
    hexGrid.features.forEach((feat, idx) => {
        // 해안선(라인)에 가까울수록 더 잘 자람
        const center = turf.centerOfMass(feat);
        const dist = turf.pointToLineDistance(center, coastline, {units: 'kilometers'});
        
        // baseCarbon: 현재 탄소량 (10 ~ 50 톤)
        const baseCarbon = 10 + Math.random() * 40;
        
        // growthRate: 연간 복원/성장률 (1.05배 ~ 1.25배)
        let growthRate = 1.05 + Math.random() * 0.1;
        if (dist < 1.0) growthRate += 0.1; // 바다 쪽 최전선 복원 구역은 더 빠름
        
        feat.properties.id = idx;
        feat.properties.baseCarbon = baseCarbon;
        feat.properties.growthRate = growthRate;
        feat.properties.currentCarbon = baseCarbon; // 렌더링용 변수
    });

    // 3. 맵 로드 및 레이어 추가
    map.on('load', () => {
        // 광원(Light) 설정 추가하여 3D 입체감 부각
        map.setLight({
            anchor: 'viewport',
            color: '#ffffff',
            intensity: 0.6,
            position: [1.5, 90, 80]
        });

        map.addSource('dmrv-grid', {
            type: 'geojson',
            data: hexGrid
        });

        // 3D Extrusion 레이어 추가
        map.addLayer({
            id: 'dmrv-3d-layer',
            type: 'fill-extrusion',
            source: 'dmrv-grid',
            paint: {
                // 탄소량에 따라 색상 보간 (황갈색 -> 네온 그린)
                'fill-extrusion-color': [
                    'interpolate',
                    ['linear'],
                    ['get', 'currentCarbon'],
                    10, '#b45309', // 낮음 (황갈색)
                    30, '#d97706',
                    60, '#10b981', // 중간 (녹색)
                    120, '#059669', // 높음 (짙은 녹색)
                    200, '#86efac'  // 아주 높음 (밝은 네온)
                ],
                // 탄소량에 따라 3D 기둥 높이 보간 (가시성을 위해 과장)
                'fill-extrusion-height': [
                    '*',
                    ['get', 'currentCarbon'],
                    5 // 1톤당 5미터 높이로 과장
                ],
                // 기본 떠있는 높이
                'fill-extrusion-base': 0,
                // 불투명도
                'fill-extrusion-opacity': 0.85
            }
        });

        // 초기 데이터 업데이트
        updateDashboard(2024);
    });

    // 4. 데이터 갱신 로직 (연도 변화에 따른 탄소량 재계산)
    function updateDashboard(year) {
        let totalCarbon = 0;
        let avgNdviSum = 0;
        
        hexGrid.features.forEach(feat => {
            const prop = feat.properties;
            // 복리 계산 로직: 현재 값 = 기본값 * (성장률 ^ 연도차이)
            const yearDiff = year - 2024;
            const newCarbon = prop.baseCarbon * Math.pow(prop.growthRate, yearDiff);
            prop.currentCarbon = newCarbon;
            
            totalCarbon += newCarbon;
            
            // NDVI (0.2 ~ 0.9)로 임의 환산
            const ndvi = Math.min(0.95, 0.2 + (newCarbon / 300));
            avgNdviSum += ndvi;
        });

        // GeoJSON 소스 업데이트하여 3D 렌더링 즉시 반영
        if (map.getSource('dmrv-grid')) {
            map.getSource('dmrv-grid').setData(hexGrid);
        }

        // KPI UI 업데이트
        document.getElementById('kpi-carbon').innerHTML = Math.floor(totalCarbon).toLocaleString() + '<span class="kpi-unit">Tons</span>';
        
        const avgNdvi = avgNdviSum / hexGrid.features.length;
        document.getElementById('kpi-ndvi').innerHTML = avgNdvi.toFixed(2) + '<span class="kpi-unit">Idx</span>';
    }

    // 5. 슬라이더 및 애니메이션 컨트롤
    const slider = document.getElementById('year-slider');
    const label = document.getElementById('year-label');
    const playBtn = document.getElementById('play-btn');
    
    let isPlaying = false;
    let animationReq = null;

    slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        label.innerText = Math.floor(val);
        updateDashboard(val);
    });

    function animateTimeline() {
        if (!isPlaying) return;
        
        let val = parseFloat(slider.value);
        val += 0.02; // 애니메이션 속도
        
        if (val > 2030) { 
             val = 2030;
        }

        if (val >= 2030) {
            val = 2030;
            slider.value = val;
            label.innerText = "2030";
            updateDashboard(val);
            
            isPlaying = false;
            playBtn.innerText = "▶";
            return;
        }

        slider.value = val;
        label.innerText = Math.floor(val);
        updateDashboard(val);

        animationReq = requestAnimationFrame(animateTimeline);
    }

    playBtn.addEventListener('click', () => {
        if (isPlaying) {
            isPlaying = false;
            playBtn.innerText = "▶";
            cancelAnimationFrame(animationReq);
        } else {
            // 끝에 도달했으면 리셋
            if (parseFloat(slider.value) >= 2030) {
                slider.value = 2024;
            }
            isPlaying = true;
            playBtn.innerText = "⏸";
            animateTimeline();
        }
    });

</script>
</body>
</html>
